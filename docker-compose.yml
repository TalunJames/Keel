# TrueNAS Scale Custom App compose file for Keel.
#
# Two services:
#   keel        — the app (API + built frontend, port 3001 inside the container)
#   cloudflared — Cloudflare Tunnel, publishes Keel to the public internet over HTTPS
#                 without opening any ports on the NAS.
#
# Before deploying:
#   1. The image below points at ghcr.io/talunjames/keel — change if your repo name differs.
#      For production, pin to an immutable per-commit tag (e.g. :sha-abc1234) from the
#      "Build and push container" GitHub Actions run rather than :latest, then bump it
#      deliberately when you want to update. The workflow only publishes images on pushes
#      to `main` or `v*` tags.
#   2. Create the host dirs and chown them to the TrueNAS apps user (568):
#        mkdir -p /mnt/<pool>/apps/keel/{data,uploads}
#        chown -R 568:568 /mnt/<pool>/apps/keel
#      Adjust the bind-mount source paths below to match your pool.
#   3. Fill in the env vars (JWT_SECRET, BOOTSTRAP_ADMIN_EMAIL, TUNNEL_TOKEN) in
#      TrueNAS's "Environment Variables" UI — do NOT commit real secrets to this file.
#      On first boot, read the one-time `SETUP TOKEN` from the container logs
#      (`docker logs keel`), open the app URL, and complete the first-boot setup
#      screen (enter the token + choose the admin password).

services:
  keel:
    image: ghcr.io/talunjames/keel:latest
    # `pull_policy: always` re-checks GHCR on every container start so a restart
    # picks up a new :latest. For production, pin `image:` to a :sha- tag above and
    # drop this to `missing` (the default) for reproducible deploys.
    pull_policy: always
    container_name: keel
    restart: unless-stopped
    user: "568:568"
    environment:
      NODE_ENV: production
      PORT: "3001"
      SERVE_STATIC: "true"
      DATABASE_PATH: /app/data/keel.db
      VOTER_DATA_DIR: /app/data/voter
      ELECTION_DATA_DIR: /app/data/election
      ELECTION_RESULTS_DB_PATH: /app/data/election/results.db
      EP_DB_PATH: /app/data/election/results.db
      EP_RAW_DIR: /app/data/election/raw
      # Set to 1 to start ENR polling when the container boots (or use the UI)
      ELECTION_COLLECTOR_AUTO_START: ${ELECTION_COLLECTOR_AUTO_START:-0}
      EP_EID: ${EP_EID:-126592}
      EP_ENFORCE_POLLS_CLOSE: ${EP_ENFORCE_POLLS_CLOSE:-0}
      EP_POLL_SECONDS: ${EP_POLL_SECONDS:-7}
      # No default: a stale/past polls-close instant would immediately halt polling
      # when EP_ENFORCE_POLLS_CLOSE=1. Set this per election, e.g.
      # EP_POLLS_CLOSE_UTC=2026-11-03T02:00:00+00:00
      EP_POLLS_CLOSE_UTC: ${EP_POLLS_CLOSE_UTC:-}
      ELECTION_CONTEST_PATTERNS: ${ELECTION_CONTEST_PATTERNS:-Governor,United States Senator,Congress District 5,State Representative District,State Senator District,County Commissioner}
      # Required. In production the server refuses to start without it.
      # Generate with: openssl rand -hex 32
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      # Session lifetime in seconds (8h = 28800).
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-28800}
      # Initial administrator email. Override in TrueNAS env vars if you like.
      # First boot prints a one-time SETUP TOKEN to the logs; use it to set the
      # admin password on the setup screen. There is no ADMIN_PASSWORD.
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-cjames@fogsignal.co}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Carter James}
      # Comma-separated allowlist. Add every public hostname that fronts Keel.
      # No spaces around commas.
      CORS_ORIGIN: ${CORS_ORIGIN:-https://keel.fogsignalstrategies.com,https://keel.fogsignal.com}
      APP_URL: ${APP_URL:-https://keel.fogsignalstrategies.com,https://keel.fogsignal.com}
      # Google Workspace SMTP relay — configure in Admin → Gmail → Routing first.
      MAIL_ENABLED: ${MAIL_ENABLED:-1}
      SMTP_HOST: ${SMTP_HOST:-smtp-relay.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-0}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Keel <keel@fogsignal.co>}
      # Claude (Anthropic) API key for the proposal-editor AI features.
      # Without it, the AI controls stay hidden / return a "not configured" notice.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - /mnt/tank/apps/keel/data:/app/data
      - /mnt/tank/apps/keel/uploads:/app/uploads
    networks:
      - keel-net
    # No ports exposed to the host — cloudflared reaches keel via the internal network.
    # If you want LAN access too, uncomment:
    # ports:
    #   - "3001:3001"

  cloudflared:
    # Pinned to a versioned release. Bump deliberately: check
    # https://github.com/cloudflare/cloudflared/releases for the newest tag.
    image: cloudflare/cloudflared:2026.6.1
    pull_policy: missing
    container_name: keel-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN is required}
    depends_on:
      - keel
    networks:
      - keel-net

networks:
  keel-net:
    driver: bridge
