# TrueNAS Scale Custom App compose file for Keel.
#
# Two services:
#   keel        — the app (API + built frontend, port 3001 inside the container)
#   cloudflared — Cloudflare Tunnel, publishes Keel to the public internet over HTTPS
#                 without opening any ports on the NAS.
#
# Before deploying:
#   1. The image below points at ghcr.io/talunjames/keel:latest — change if your repo name differs.
#      `pull_policy: always` makes docker re-check GHCR every time the container starts,
#      so a TrueNAS app restart (or full reboot) picks up the newest :latest automatically.
#      Caveat: a new image only exists after the GitHub Actions "Build and push container"
#      workflow runs, which only fires on pushes to `main` or `v*` tags. Merge feature
#      branches into main, then restart the app to pull.
#   2. Create the host dirs and chown them to the TrueNAS apps user (568):
#        mkdir -p /mnt/<pool>/apps/keel/{data,uploads}
#        chown -R 568:568 /mnt/<pool>/apps/keel
#      Adjust the bind-mount source paths below to match your pool.
#   3. Fill in the env vars (JWT_SECRET, TUNNEL_TOKEN) in TrueNAS's
#      "Environment Variables" UI — do NOT commit real secrets to this file.
#      On first boot, open the app URL and set the administrator password
#      for BOOTSTRAP_ADMIN_EMAIL (default cjames@fogsignal.co).

services:
  keel:
    image: ghcr.io/talunjames/keel:latest
    pull_policy: always
    container_name: keel
    restart: unless-stopped
    user: "568:568"
    environment:
      NODE_ENV: production
      PORT: "3001"
      SERVE_STATIC: "true"
      DATABASE_PATH: /app/data/keel.db
      VOTER_DATA_DIR: /app/data/voter
      ELECTION_DATA_DIR: /app/data/election
      ELECTION_RESULTS_DB_PATH: /app/data/election/results.db
      EP_DB_PATH: /app/data/election/results.db
      EP_RAW_DIR: /app/data/election/raw
      # Set to 1 to start ENR polling when the container boots (or use the UI)
      ELECTION_COLLECTOR_AUTO_START: ${ELECTION_COLLECTOR_AUTO_START:-0}
      EP_EID: ${EP_EID:-126592}
      EP_ENFORCE_POLLS_CLOSE: ${EP_ENFORCE_POLLS_CLOSE:-0}
      EP_POLL_SECONDS: ${EP_POLL_SECONDS:-7}
      EP_POLLS_CLOSE_UTC: ${EP_POLLS_CLOSE_UTC:-2026-07-01T01:00:00+00:00}
      ELECTION_CONTEST_PATTERNS: ${ELECTION_CONTEST_PATTERNS:-Governor,United States Senator,Congress District 5,State Representative District,State Senator District,County Commissioner}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: 8h
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-cjames@fogsignal.co}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Carter James}
      # Comma-separated allowlist. Add every public hostname that fronts Keel
      # (e.g. cloudflared tunnels for portal.fogsignalstrategies.com and
      # keel.fogsignalstrategies.com). No spaces around commas.
      CORS_ORIGIN: ${CORS_ORIGIN:-https://keel.example.com,https://portal.example.com}
    volumes:
      - /mnt/tank/apps/keel/data:/app/data
      - /mnt/tank/apps/keel/uploads:/app/uploads
    networks:
      - keel-net
    # No ports exposed to the host — cloudflared reaches keel via the internal network.
    # If you want LAN access too, uncomment:
    # ports:
    #   - "3001:3001"

  cloudflared:
    image: cloudflare/cloudflared:latest
    pull_policy: always
    container_name: keel-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN is required}
    depends_on:
      - keel
    networks:
      - keel-net

networks:
  keel-net:
    driver: bridge
