name: Build and push container

# Builds the Keel Docker image and pushes it to GitHub Container Registry
# (ghcr.io/<owner>/<repo>) on every push to the default branch and on `v*`
# tags. Uses the automatic GITHUB_TOKEN — no extra secrets to configure.

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Resolves to ghcr.io/<owner>/<repo> in lowercase.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Produce:
          #   sha-<short>  immutable per-commit tag (recommended for prod pins)
          #   latest       rolling tag, only on the default branch
          #   v1.2.3       semver tags on `v*` git tags
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Surfaced at runtime via KEEL_* env vars and /api/version.
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_SHA_SHORT=${{ github.sha }}
            BUILD_TIME=${{ github.event.repository.updated_at }}
            GIT_REF=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
